# Deploy automatico: todo push na main que mexer em supabase/ aplica as
# migrations (e as Edge Functions, se existirem) no projeto do Supabase.
#
# Precisa de 3 segredos no repositorio (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, SUPABASE_DB_PASSWORD
# Passo a passo em docs/SUPABASE.md.

name: Deploy no Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

# Se duas pessoas enviarem ao mesmo tempo, os deploys rodam em fila, nunca juntos.
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    name: Aplicar migrations e functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Instalar a CLI do Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Conferir se os 3 segredos estao configurados
        run: |
          faltando=""
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then faltando="$faltando SUPABASE_ACCESS_TOKEN"; fi
          if [ -z "$SUPABASE_PROJECT_ID" ];   then faltando="$faltando SUPABASE_PROJECT_ID"; fi
          if [ -z "$SUPABASE_DB_PASSWORD" ];  then faltando="$faltando SUPABASE_DB_PASSWORD"; fi
          if [ -n "$faltando" ]; then
            echo "::error::Faltam segredos no repositorio:$faltando"
            echo "Configure em Settings -> Secrets and variables -> Actions. Passo a passo: docs/SUPABASE.md"
            exit 1
          fi
          echo "Segredos OK"

      - name: Conectar ao projeto do Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Aplicar migrations no banco
        run: supabase db push --yes

      - name: Enviar Edge Functions (so se existirem)
        if: ${{ hashFiles('supabase/functions/**') != '' }}
        run: supabase functions deploy --yes
