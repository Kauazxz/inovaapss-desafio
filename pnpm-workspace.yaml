# Monorepo: cada pasta em apps/ e packages/ e um pacote do workspace.
packages:
  - 'apps/*'
  - 'packages/*'

# O pnpm nao roda scripts de pos-instalacao de dependencias sem aprovacao explicita.
#   supabase      -> baixa o binario da CLI
#   unrs-resolver -> resolvedor nativo usado pelo eslint-plugin-import-x
# Se o install acusar "Ignored build scripts: <pacote>", acrescente o pacote aqui com true.
allowBuilds:
  supabase: true
  unrs-resolver: true
  # esbuild (tsx, drizzle-kit, vite) funciona sem o pos-instalacao; @scarf/scarf e
  # telemetria do swagger-ui-dist. Negados de proposito.
  esbuild: false
  '@scarf/scarf': false

# pnpm 12 recusa pacotes publicados ha menos de 24 h (protecao de supply chain).
# Excecoes pontuais para versoes ja no lockfile e publicadas dentro dessa janela;
# podem ser removidas depois que a versao completar 24 h.
minimumReleaseAgeExclude:
  - turbo@2.11.2
  - '@turbo/*'
  - '@types/node@22.20.4'
  - eslint@10.11.0
